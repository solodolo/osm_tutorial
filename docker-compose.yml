services:
  postgis:
    image: postgis/postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgis
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "1"
      MAX_CLIENT_CONN: "20"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5

  pg_tileserv:
    image: pramsey/pg_tileserv
    hostname: wikimap_pg_tileserv
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@pgbouncer:6432/postgis
    ports:
      - "127.0.0.1:7800:7800"
    depends_on:
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./wikimap/pg_tileserv.toml:/config/pg_tileserv.toml:ro,z
networks:
  default:
    name: wikimaps_network
volumes:
  postgis_data:
